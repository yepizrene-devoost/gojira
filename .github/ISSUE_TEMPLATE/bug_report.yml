name: Bug report
description: Report a bug or unexpected behavior in gojira
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Reproducible details speed up the fix.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "Describe what you expected and what actually happened..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Ordered steps to reproduce the bug.
      placeholder: |
        1. Run `gojira get ARA-1892 --json`
        2. ...
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
  - type: input
    id: version
    attributes:
      label: gojira version
      placeholder: "Output of `gojira version`, e.g. v0.1.0"
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Go version, auth method (API token / config file)"
  - type: dropdown
    id: auth-method
    attributes:
      label: Authentication method
      options:
        - API token (env vars)
        - API token (config file)
        - Keychain
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Command output or error messages, if any.
      render: shell
