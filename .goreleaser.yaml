version: 2

project_name: gojira

builds:
  - id: gojira
    main: .
    binary: gojira
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}

archives:
  - id: release
    ids:
      - gojira
    name_template: >-
      {{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog generation is intentionally omitted; release notes are hand-curated.
release:
  mode: replace
  github:
    owner: yepizrene-devoost
    name: gojira
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1
