# git-cliff configuration for gojira.
#
# Commits follow `type(scope): description` (see AGENTS.md): lowercase type,
# optional scope, no ticket prefixes and no file paths in the message.
# Regenerate the draft with `make changelog`.

[changelog]
header = "# Changelog\n\nAll notable changes to this project are documented in this file.\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Styles" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Tests" },
    { message = "^chore", group = "Chores" },
    { message = "^revert", group = "Reverts" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
